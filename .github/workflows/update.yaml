name: update

on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * *"

permissions:
  contents: read

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ vars.APP_ID }}
          private-key: ${{ secrets.PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          token: ${{ steps.app-token.outputs.token }}
          persist-credentials: false
      - uses: jdx/mise-action@1648a7812b9aeae629881980618f079932869151 # v4.0.1
      - run: mise run update
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
      - id: pr
        uses: peter-evans/create-pull-request@c0f553fe549906ede9cf27b5156039d195d2ece0 # v8.1.0
        with:
          token: ${{ steps.app-token.outputs.token }}
          branch: fix/update-formulae
          commit-message: "fix: update formulae"
          title: "fix: update formulae"
          body: |
            Update the Homebrew formulae to the latest upstream releases.
      - if: ${{ steps.pr.outputs.pull-request-number }}
        run: gh pr merge '${{ steps.pr.outputs.pull-request-number }}' --auto --merge
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
